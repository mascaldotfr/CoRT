<!DOCTYPE html>
<html lang="en">
	<head>

		<script>
			const SUPPORT_NESTED = CSS.supports('selector(&)');
			const SAVED_THEME = localStorage.getItem("colorscheme") || "";

		</script>
		<meta charset="utf-8">

		<link rel="stylesheet" href="css/wevents.css">
